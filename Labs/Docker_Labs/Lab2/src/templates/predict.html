<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wine Classifier</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f3f5;
        }
        h1 {
            color: #6b2737;
            text-align: center;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
            color: #444;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #6b2737;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #8b3a4a;
        }
        #result {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #6b2737;
        }
    </style>
</head>
<body>
    <h1>🍷 Wine Class Predictor</h1>
    <form id="predict-form">
        <div class="form-group">
            <label>Alcohol</label>
            <input type="number" step="0.01" name="alcohol" placeholder="e.g. 13.2" required>
        </div>
        <div class="form-group">
            <label>Malic Acid</label>
            <input type="number" step="0.01" name="malic_acid" placeholder="e.g. 1.78" required>
        </div>
        <div class="form-group">
            <label>Ash</label>
            <input type="number" step="0.01" name="ash" placeholder="e.g. 2.14" required>
        </div>
        <div class="form-group">
            <label>Alcalinity of Ash</label>
            <input type="number" step="0.01" name="alcalinity_of_ash" placeholder="e.g. 11.2" required>
        </div>
        <div class="form-group">
            <label>Magnesium</label>
            <input type="number" step="0.01" name="magnesium" placeholder="e.g. 100.0" required>
        </div>
        <div class="form-group">
            <label>Total Phenols</label>
            <input type="number" step="0.01" name="total_phenols" placeholder="e.g. 2.65" required>
        </div>
        <div class="form-group">
            <label>Flavanoids</label>
            <input type="number" step="0.01" name="flavanoids" placeholder="e.g. 2.76" required>
        </div>
        <div class="form-group">
            <label>Nonflavanoid Phenols</label>
            <input type="number" step="0.01" name="nonflavanoid_phenols" placeholder="e.g. 0.26" required>
        </div>
        <div class="form-group">
            <label>Proanthocyanins</label>
            <input type="number" step="0.01" name="proanthocyanins" placeholder="e.g. 1.28" required>
        </div>
        <div class="form-group">
            <label>Color Intensity</label>
            <input type="number" step="0.01" name="color_intensity" placeholder="e.g. 4.38" required>
        </div>
        <div class="form-group">
            <label>Hue</label>
            <input type="number" step="0.01" name="hue" placeholder="e.g. 1.05" required>
        </div>
        <div class="form-group">
            <label>OD280/OD315 of Diluted Wines</label>
            <input type="number" step="0.01" name="od280_od315" placeholder="e.g. 3.40" required>
        </div>
        <div class="form-group">
            <label>Proline</label>
            <input type="number" step="0.01" name="proline" placeholder="e.g. 1050.0" required>
        </div>
        <button type="submit">Predict Wine Class</button>
    </form>

    <div id="result"></div>

    <script>
        $('#predict-form').on('submit', function(event) {
            event.preventDefault();
            $.ajax({
                url: '/predict',
                type: 'POST',
                data: $(this).serialize(),
                success: function(response) {
                    if (response.predicted_class) {
                        $('#result').html('🍷 Predicted Class: <span>' + response.predicted_class + '</span>');
                    } else {
                        $('#result').html('Error: ' + response.error);
                    }
                },
                error: function() {
                    alert('Error: Could not reach the prediction server.');
                }
            });
        });
    </script>
</body>
</html>
